version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: patterniq-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: patterniq
    volumes:
      - mongodb_data:/data/db
    networks:
      - patterniq-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patterniq-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/patterniq
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - patterniq-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patterniq-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - patterniq-network

volumes:
  mongodb_data:

networks:
  patterniq-network:
    driver: bridge
